[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorecord-triage-bench"
version = "0.1.0"
description = "Controlled evaluation of tool-using agents for biodiversity occurrence metadata triage"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["ecorecord_triage*"]
